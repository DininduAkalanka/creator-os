# Local containers.
#   docker compose up -d                          ->  PostgreSQL 18 + pgvector (db) and local S3 (s3)
#   docker compose up --build --detach www        ->  the website, http://localhost:3000
# Passwords and keys come from .env in this folder (copy the block from .env.example). Ports are
# bound to 127.0.0.1 only. The "www" service sits in a profile, so a plain "docker compose up"
# starts only db and s3 and doesn't clash with "pnpm dev".
name: creatoros

services:
  db:
    # PostgreSQL 18.7 with pgvector 0.8.7 (ADR-022), pinned by digest. The integration tests run
    # the same image (packages/db/test/global-setup.ts).
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: creatoros
      # Read by docker/postgres/initdb/010-roles.sh on the first start (PLAN.md §3.1).
      CREATOROS_MIGRATOR_PASSWORD: ${CREATOROS_MIGRATOR_PASSWORD:-}
      CREATOROS_APP_PASSWORD: ${CREATOROS_APP_PASSWORD:-}
      CREATOROS_AUTH_PASSWORD: ${CREATOROS_AUTH_PASSWORD:-}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql # PostgreSQL 18 images keep PGDATA under this folder
      - ./packages/db/sql/roles:/creatoros/roles:ro
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname creatoros"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3:
    # RustFS 1.0.6 (Apache-2.0), an S3-compatible store, chosen in M3 under ADR-022 (PROGRESS.md).
    # Nothing uses it before uploads (T2.3), and code talks to it only through the S3 API.
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-}
    # Refuse to start without keys: an empty key would fall back to a well-known default.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        : "$${RUSTFS_ACCESS_KEY:?Set S3_ACCESS_KEY in .env (see .env.example)}";
        : "$${RUSTFS_SECRET_KEY:?Set S3_SECRET_KEY in .env (see .env.example)}";
        exec /etc/rustfs/entrypoint.sh rustfs
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  www:
    profiles: [site]
    build:
      context: .
      dockerfile: apps/www/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        SITE_INDEXABLE: "false"
    image: creatoros-www:local
    ports:
      - "${WWW_PORT:-3000}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/www/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  db-data:
  s3-data:
