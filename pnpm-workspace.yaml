packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 runs dependency install scripts only when allowed here.
# Same choices create-next-app 16.4.6 made: Next works without these native builds.
allowBuilds:
  sharp: false
  unrs-resolver: false
  # packages/db dev tools (M3), checked to work without their scripts: esbuild (drizzle-kit loads
  # the TypeScript schema with it), and testcontainers' optional SSH speed-ups and a version check.
  esbuild: false
  ssh2: false
  cpu-features: false
  protobufjs: false
